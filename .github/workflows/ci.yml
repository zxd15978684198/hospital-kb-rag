# PyKnora CI —— GitHub Actions
#
# 设计取舍（与本地门禁 `scripts/ci.py` 对齐，但不照搬）：
#   1. lint / unit / secrets 三个 job 并行，先给最快反馈；integration 依赖 unit 通过后才起 PG，
#      否则白烧 3 分钟装库；
#   2. integration 用 service container 起 pgvector，**真跑全部迁移 + 外键断言**——
#      这是本地 pre-commit 故意不跑的部分（见本地提交门禁约定）；
#   3. security 独立 job：pip-audit 要联网、结果随 OSV 变化，不该卡提交，
#      也不该让它的网络抖动把 PR 判红；
#   4. docker job 只验"镜像与编排定义是自洽的、能构建"，不跑 `up`（要下 torch 与模型，太重）；
#   5. release job 只在 tag 上触发，产物带 attestation；PyPI/registry 的推送**故意留注释**，
#      发布目标属于团队决策，不在脚手架里替人猜；
#   6. 不跑 pre-commit 钩子套件（prek 会 stash 未暂存改动，在 CI 里没有意义）。
#
# 与本地门禁的对应关系：
#   本地 `uv run python scripts/ci.py --stage all`            ≈ lint + unit
#   本地 `uv run python scripts/ci.py --stage security`       ≈ security
#   本地 `uv run python scripts/ci.py --stage secrets`        ≈ secrets
#   本地 `uv run python scripts/ci.py --stage integration`    ≈ integration（需真 PG）
#   本地 `uv run python scripts/ci.py --stage container`      ≈ docker（需 Docker）
#   `type`（ty check）目前**故意不进 CI**：真实诊断 31 条，先清再接。
name: CI
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_FROZEN: "1"
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Verify lock file matches pyproject
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # `.tmp_ref/` 是本地临时参考目录，已在 .gitignore 中忽略。
      # ruff 默认 respect-gitignore，不会扫到这些文件。
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      # CI 侧语法检查：workflow 自己写错时，别等到都跑完了才发现。
      - name: actionlint (workflow syntax)
        run: |
          # 钉死版本：跟随 main 分支的安装脚本会让门禁口径随上游漂移，
          # 且多一次 raw.githubusercontent 依赖（该域名抖动时整步失败）。
          version=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint --version
          /tmp/actionlint -color
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # 覆盖率门槛 70%：2026-11-03 实测 `tests/unit` 对 `src/pyknora` 是 74%。
      # 门槛低于实测是刻意的——它是防"删测试换绿灯"的底线，不是质量 KPI；
      # 想提高就提这个数字，别用 --cov-omit 把难测的模块排除掉。
      - name: pytest + coverage
        run: |
          mkdir -p reports
          uv run pytest -q tests/unit \
            --cov=pyknora --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=70 \
            --junitxml=reports/unit-junit.xml
      # 失败时的现场比"看日志"值钱：junit 有逐用例耗时与断言原文，
      # coverage.xml 能看出是"没测到"还是"测了但挂了"。
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7
  security:
    name: Secret scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # 与本地同一个入口：scripts/secret_scan.py 比对 .secrets.baseline。
      # **advisory（--report-only）**：本仓库的开发 DSN、测试占位 key、文档示例会在
      # 约 40 处命中，而 `detect-secrets scan` 在本机复现不出 hook 的口径、
      # 生成不出 hook 认的 baseline。先让它可见而不阻断；要阻断就逐处加
      # `# pragma: allowlist secret`（见 docs/部署与回滚.md §3）。
      - name: secret scan (advisory)
        run: uv run python scripts/secret_scan.py --report-only
  integration:
    name: Integration tests (pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: pyknora
        # 宿主 5433：本作业自行指定，与 compose 的 5435 默认值无关；
        # 因为下面的 env 显式覆盖了 database_url，conftest 不用改一行。
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d pyknora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 测试从 settings 读，前缀 PYKNORA_；显式写出来，避免依赖默认值。
      PYKNORA_DATABASE_URL: postgresql+asyncpg://postgres:dev@127.0.0.1:5433/pyknora
      # psql 走同一个库，但用原生的 postgresql:// scheme（asyncpg 驱动不认）。
      PYKNORA_PSQL_URL: postgresql://postgres:dev@127.0.0.1:5433/pyknora
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # migrations/*.sql 是 psql 脚本（`\set` 与 `:dim`），不是纯 SQL：
      # 必须用 psql 客户端 + `-v dim=512` 喂，不能用 asyncpg 直接执行。
      # 按文件名顺序全量执行——只跑 0001 会让后面 13 个迁移（含视图、RLS、游标列）
      # 在 CI 里完全没被验证过。
      - name: Apply all migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(migrations/*.sql)
          echo "migrations: ${#files[@]}"
          for f in "${files[@]}"; do
            echo "==> $f"
            psql "$PYKNORA_PSQL_URL" -v ON_ERROR_STOP=1 -v dim=512 -f "$f" >/dev/null
          done
      # 防"文档说有关联、库里没有"：复合外键必须真的在。
      # 期望值不写死，直接数迁移文件里的 FOREIGN KEY 声明（排除注释行）——
      # 写死 7 时后面 13 个迁移的外键就从没被断言过。
      - name: Assert foreign keys match migrations
        run: |
          set -euo pipefail
          # 每个外键都必然带 REFERENCES 子句，但未必写成 "FOREIGN KEY ..."——
          # 列内联写法（col uuid REFERENCES t(id)）同样建外键。只数 FOREIGN KEY
          # 会漏掉 9 个，期望值 10 而库里 15，断言永远为假。
          expected=$(grep -h 'REFERENCES' migrations/*.sql | grep -vcE '^[[:space:]]*--' || true)
          actual=$(psql "$PYKNORA_PSQL_URL" -tAc "SELECT count(*) FROM pg_constraint WHERE contype = 'f'")
          echo "foreign keys: migrations=$expected database=$actual"
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::外键数与 migrations 声明不一致（migrations=$expected db=$actual）"
            psql "$PYKNORA_PSQL_URL" -c "\d documents"
            exit 1
          fi
      # tests/api 与 tests/integration 都连真库。
      - name: pytest (integration + api)
        run: |
          mkdir -p reports
          uv run pytest -q tests/integration tests/api --junitxml=reports/integration-junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7
  # 与本地 `python scripts/ci.py --stage eval` 走同一条路径：
  # scripts/eval_local.py 自己起 stub 假模型 + 入库 worker + 临时 uvicorn（空闲端口），
  # 跑完即拆。所以"本地绿、CI 红"只可能是代码差异，不可能是栈搭法不同。
  #
  # 为什么 CI 里不接真模型：fork 的 PR 拿不到密钥，而且同输入两次跑措辞就变，
  # 指标会跟着模型抖动——门禁一旦会自己抖，红灯就不再是信号。
  eval:
    name: Eval regression gate (deterministic stub LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: pyknora
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d pyknora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 只给迁移步骤用；下面跑门禁那步自己带 PYKNORA_DATABASE_URL / PYKNORA_WORKER_DATABASE_URL。
      PYKNORA_PSQL_URL: postgresql://postgres:dev@127.0.0.1:5433/pyknora
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      # 不装 local-embed：这条门禁用的是确定性 hashing 嵌入（见下面 env），
      # torch 一层几百 MB，装上既不必要也会拖慢 job。
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Apply all migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(migrations/*.sql)
          for f in "${files[@]}"; do
            echo "==> $f"
            psql "$PYKNORA_PSQL_URL" -v ON_ERROR_STOP=1 -v dim=512 -f "$f" >/dev/null
          done
      - name: Eval gate against committed baseline
        id: eval
        env:
          # 被测服务与入库 worker 各用一个非 owner 角色：CI 里顺带证明 0017 的角色接线没坏。
          # 迁移仍用 postgres——建表、建策略、建角色都需要 owner。
          PYKNORA_DATABASE_URL: postgresql+asyncpg://pyknora_app:pyknora_app_dev@127.0.0.1:5433/pyknora
          PYKNORA_WORKER_DATABASE_URL: postgresql+asyncpg://pyknora_worker:pyknora_worker_dev@127.0.0.1:5433/pyknora
          # 确定性嵌入：跑得快、无模型下载，但向量路没有语义能力。
          # 所以这条门禁判的是"接线断没断、门控还拦不拦得住"，不是答案质量。
          PYKNORA_EMBEDDING_BACKEND: hashing
        # tee 一份：下面的失败回显步骤靠它把真错误变成 annotation，
        # 公开仓匿名看不到 actions 日志，annotation 是唯一进得了 issue/PR 的出口。
        run: |
          set -o pipefail
          uv run python scripts/eval_local.py --baseline eval/baselines/stub-hashing 2>&1 | tee "$RUNNER_TEMP/eval-gate.log"
      - name: Surface eval failure
        if: failure() && steps.eval.outcome == 'failure'
        env:
          PYKNORA_PSQL_URL: postgresql://postgres:dev@127.0.0.1:5433/pyknora
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import os, pathlib

          def esc(s: str) -> str:
              return s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")

          tmp = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp"))
          log_path = tmp / "eval-gate.log"
          text = log_path.read_text(errors="replace") if log_path.exists() else "(no eval-gate.log)"
          lines = text.splitlines()
          parts = ["==== head 60 ====", *lines[:60], "==== tail 60 ====", *lines[-60:]]
          results = sorted(pathlib.Path("eval/results").glob("ci-*"), key=lambda p: p.stat().st_mtime)
          if results:
              summary = results[-1] / "summary.json"
              if summary.exists():
                  parts += ["==== summary ====", summary.read_text(errors="replace")[:3000]]
          print("::error title=eval gate::" + esc("\n".join(parts)))
          PY
          psql "$PYKNORA_PSQL_URL" -At -F' | ' -c "select 'chunk_rows', count(*) from chunks" -c "select 'doc_rows', count(*) from documents" -c "select 'job_status', status, count(*) from ingestion_jobs group by status order by status" -c "select 'kb_rows', count(*) from knowledge_bases" 2>&1 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=eval db::${line}"; done

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: warn
          retention-days: 7
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # pip-audit 不在项目依赖里，必须用 --with 临时装；
      # 审计的是 uv 解析出来的环境（等价于 uv.lock 的锁定集），不是当前 pip 缓存。
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --progress-spinner off
  docker:
    name: Docker (compose + image build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - uses: actions/checkout@v4
      # 1) 编排定义自洽：语法、变量插值、依赖条件都在这一步暴露，不用等构建
      - name: docker compose config
        run: docker compose config --quiet
      # 2) Dockerfile 静态检查（不执行构建，秒级）
      - name: docker build --check (api)
        run: docker build --check .
      - name: docker build --check (web)
        run: docker build --check ./web
      # 3) 真构建，但**不带 local-embed**：torch 一层就几百 MB，
      #    PR 上没必要每次烤一遍；容器里只用远端 embedding 时的路径也要能构建。
      - name: Build api image (no local-embed)
        run: docker build --build-arg INSTALL_LOCAL_EMBED=false -t pyknora-api:ci .
      - name: Build web image (standalone)
        run: docker build --build-arg API_PROXY_TARGET=http://api:8010 -t pyknora-web:ci ./web
      # 4) 镜像体检：非 root 与体积。report 模式，不阻断。
      #
      #    这里不再调 scripts/container_report.py：那个脚本（gatekeeper 生成物）
      #    只认 --root，然后按 compose 里第一个服务去查镜像。本项目第一个服务是
      #    db（pgvector），栈在 CI 里没起、镜像也没拉，6 项会全部 skip；而传进去的
      #    `pyknora-api:ci` 是位置参数，argparse 直接 exit 2。
      #    CI 只需要确认刚构建的镜像本身，一条 inspect 就够；要跑完整 6 项体检
      #    请在本机 docker compose up -d --wait 之后跑那个脚本。
      - name: Image report (default user, size)
        run: docker image inspect --format 'user={{.Config.User}} size={{.Size}}B' pyknora-api:ci
      - name: Image report (web)
        run: docker image inspect --format 'user={{.Config.User}} size={{.Size}}B' pyknora-web:ci
  build:
    name: Package (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    # 构建产物是这条流水线的公共产物：release 直接下载它，不重复 build ——
    # 两次构建会产出两个哈希不同的 wheel，attestation 与 Release 就对不上。
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # 先清空 dist/：构建失败时若还留着旧 wheel，后面的上传/发布就会把它发出去。
      - name: Clear dist/
        run: uv run python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
      - name: Build sdist + wheel
        run: uv build --out-dir dist
      - name: Verify dist contents
        run: |
          set -euo pipefail
          ls -l dist/
          test -n "$(ls dist/*.whl)" || { echo "::error::没有 wheel"; exit 1; }
          test -n "$(ls dist/*.tar.gz)" || { echo "::error::没有 sdist"; exit 1; }
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
  release:
    name: Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit, integration, lint, build]
    # 发布要写：创建 Release 与 attestation 都需要写权限；其余 job 只有 read。
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # persist-credentials: false —— 后续步骤不需要用这个 token 推代码
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # 版本一致性：tag 与 pyproject 的 version 必须对得上（scripts/validate_version_manifest.py 只校验清单）
      - name: Check tag matches pyproject version
        run: |
          set -euo pipefail
          version=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$version tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 pyproject version $version 不一致"
            exit 1
          fi
      # 复用 build job 的产物：一次构建、一个哈希，attestation 与 Release 指向同一份字节。
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      # 创建 Release（带 --verify-tag：tag 不存在就报错，不偷偷建）
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
      # --- 下面两步故意留注释：发布到 PyPI 还是私有索引、镜像推哪个 registry，
      #     属于团队决策，脚手架不替人猜。
      #
      # - name: Publish to PyPI
      #   run: uv publish --token ${{ secrets.PYPI_TOKEN }}
      #
      # - name: Push image to registry
      #   run: |
      #     echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_HOST }}" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      #     docker tag pyknora-api:ci "${{ secrets.REGISTRY_HOST }}/pyknora-api:${GITHUB_REF_NAME}"
      #     docker push "${{ secrets.REGISTRY_HOST }}/pyknora-api:${GITHUB_REF_NAME}"
